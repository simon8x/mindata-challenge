<article class="overlay-card">
  <div class="overlay-card__media">
    <app-responsive-image
      [src]="imageSrc()"
      [srcset]="imageSrcset()"
      [sizes]="imageSizes()"
      [alt]="imageAlt()"
      [ratio]="ratio()"
    />
  </div>
  <div class="overlay-card__content">
    <div class="overlay-card__text">
      <h3 class="overlay-card__title">{{ title() }}</h3>
      <p class="overlay-card__excerpt">{{ excerpt() }}</p>
    </div>
    <app-button [label]="ctaLabel()" variant="text" />
  </div>
</article>
